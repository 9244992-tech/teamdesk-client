name: iOS release (TestFlight)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ios-release.yml'
      - 'flutter/ios/**'
      - 'flutter/lib/**'

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  APP_VERSION: "1.4.9"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-ios:
    name: build, sign and upload teamdesk ios
    needs: [generate-bridge]
    runs-on: macos-15
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Select newest Xcode
        shell: bash
        run: |
          # App Store принимает сборки только с iOS 26 SDK и новее, поэтому берём
          # самый свежий Xcode из тех, что стоят на раннере.
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "доступные: $(ls -d /Applications/Xcode*.app | tr n  )"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (arm64-ios)
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; echo ""; done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Build teamdesk lib (iOS arm64)
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Flutter build (no codesign, build number = run number)
        shell: bash
        run: |
          pushd flutter
          flutter build ios --release --no-codesign --build-name "$APP_VERSION" --build-number "${{ github.run_number }}"
          popd

      - name: Import distribution certificate
        shell: bash
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_DIST_CERT_P12" ]; then
            echo "::warning::сертификат распространения не задан - архив будет неподписанным"
            exit 0
          fi
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Связка не должна закрыться посреди сборки, отсюда таймаут в шесть часов.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          P12="$RUNNER_TEMP/dist.p12"
          printf '%s' "$APPLE_DIST_CERT_P12" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_DIST_CERT_PASSWORD" -A -t cert -f pkcs12
          # Без этого codesign при каждом обращении просит подтверждение из интерфейса.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$P12"
          echo "в связке ключей:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/[0-9A-F]\{40\}/<отпечаток>/'

      - name: Install provisioning profile
        shell: bash
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$APPLE_PROVISIONING_PROFILE" ]; then
            echo "::warning::профиль подписи не задан - архив будет неподписанным"
            exit 0
          fi
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          PROFILE="$DIR/teamdesk.mobileprovision"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"
          # Имя профиля нужно шагу экспорта, поэтому читаем его из самого файла.
          NAME=$(security cms -D -i "$PROFILE" | plutil -extract Name raw -)
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "установлен профиль: $NAME"

      - name: Check signing secrets
        id: sig
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_DIST_CERT_P12" ] && [ -n "$APPLE_PROVISIONING_PROFILE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set - building unsigned .ipa only"
          fi

      - name: Archive, sign and upload to App Store Connect
        if: steps.sig.outputs.enabled == 'true'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cd flutter/ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO "${AUTH[@]}" archive
          PL="$RUNNER_TEMP/ExportOptions.plist"
          # Подпись ручная: профиль заведён заранее, автоматическую Xcode сделать не может
          # - у ключа App Store Connect нет прав администратора на создание профилей.
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" -c "Add :destination string upload" -c "Add :teamID string $APPLE_TEAM_ID" -c "Add :signingStyle string manual" -c "Add :signingCertificate string Apple Distribution" -c "Add :uploadSymbols bool true" -c "Add :provisioningProfiles dict" -c "Add :provisioningProfiles:su.teamdesk.client string $PROFILE_NAME" "$PL"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" -exportOptionsPlist "$PL" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect"

      - name: Package unsigned .ipa
        if: steps.sig.outputs.enabled != 'true'
        shell: bash
        run: |
          APP=$(find flutter/build/ios -name "Runner.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "Runner.app not found"; find flutter/build/ios -maxdepth 3 -type d; exit 1; fi
          rm -rf Payload && mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r -y teamdesk-ios-unsigned.ipa Payload >/dev/null
          ls -la teamdesk-ios-unsigned.ipa

      - name: Upload unsigned artifact
        if: steps.sig.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: teamdesk-ios-unsigned
          path: teamdesk-ios-unsigned.ipa
          if-no-files-found: warn
