name: Android App Bundle (Google Play)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-play.yml'
      - 'flutter/android/**'

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.4.8"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-aab:
    name: build teamdesk app bundle
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # зеркала apt у раннеров периодически не отвечают: без таймаута шаг
          # однажды завис на два часа, а с одним лишь таймаутом упал на первой
          # же заминке. Поэтому таймаут и три попытки.
          PKGS="clang cmake curl gcc-multilib git g++ g++-multilib \
                libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
                libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                libgtk-3-dev libpam0g-dev libpulse-dev libva-dev \
                libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
                openjdk-17-jdk-headless pkg-config tree wget"
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          ok=0
          for attempt in 1 2 3; do
            if sudo timeout 600 apt-get $APT_OPTS update \
               && sudo timeout 1800 apt-get $APT_OPTS install -y $PKGS; then
              ok=1; break
            fi
            echo "::warning::попытка $attempt установки зависимостей не удалась, повтор через 30 с"
            sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "::error::зеркала apt не ответили за три попытки"
            exit 1
          fi

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: teamdesk-lib-cache-android
          key: aarch64-linux-android

      - name: Build teamdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibteamdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/libteamdesk.so

      - name: Prepare upload keystore
        id: sig
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            # при вставке секрета в веб-форму к строке иногда примешиваются
            # посторонние символы, поэтому оставляем только алфавит base64,
            # а подлинность содержимого проверяем ниже через keytool
            printf '%s' "$KS" | tr -cd 'A-Za-z0-9+/=' > /tmp/ks.b64
            echo "длина base64: $(wc -c < /tmp/ks.b64) символов"
            if ! base64 -d /tmp/ks.b64 > ./flutter/android/upload.jks 2>/tmp/b64.err; then
              echo "::error::keystore не раскодировался: $(cat /tmp/b64.err | head -2) | длина $(wc -c < /tmp/ks.b64) | начало $(cut -c1-12 /tmp/ks.b64) | конец $(tail -c 12 /tmp/ks.b64)"
              exit 1
            fi
            echo "keystore: $(wc -c < ./flutter/android/upload.jks) байт"
            if ! keytool -list -keystore ./flutter/android/upload.jks -storepass "$STOREPASS" > /tmp/kt.log 2>&1; then
              echo "::error::keytool не открыл keystore: $(tail -3 /tmp/kt.log | tr '\n' ' ')"
              exit 1
            fi
            grep -i 'PrivateKeyEntry\|Certificate fingerprint' /tmp/kt.log | head -2
            echo "::warning::keystore прочитан: $(grep -i 'Certificate fingerprint' /tmp/kt.log | head -1 | tr -d '\n')"
            {
              echo "storeFile=upload.jks"
              echo "storePassword=$STOREPASS"
              echo "keyAlias=$ALIAS"
              echo "keyPassword=$KEYPASS"
            } > ./flutter/android/key.properties
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "Ключ выгрузки подготовлен, bundle будет подписан."
          else
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "::warning::Секретов подписи нет - bundle собирается отладочным ключом и не пригоден для Google Play."
          fi

      - name: Build app bundle
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          pushd flutter
          set -o pipefail
          if ! flutter build appbundle --release --target-platform android-arm64 2>&1 | tee /tmp/aab.log; then
            # логи job видны только после входа в GitHub, поэтому выносим суть
            # ошибки в аннотацию прогона - она доступна без входа
            TAIL=$(tail -45 /tmp/aab.log | tr '\n' '~' | cut -c1-2500)
            echo "::error::$TAIL"
            exit 1
          fi
          popd
          mv ./flutter/build/app/outputs/bundle/release/app-release.aab ./teamdesk-${{ env.VERSION }}.aab
          ls -l ./teamdesk-${{ env.VERSION }}.aab

      - name: Verify bundle signature
        if: steps.sig.outputs.signed == 'true'
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          jarsigner -verify -verbose:summary ./teamdesk-${{ env.VERSION }}.aab | tail -5

      - name: Upload app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teamdesk-${{ env.VERSION }}-aab
          path: ./teamdesk-${{ env.VERSION }}.aab
