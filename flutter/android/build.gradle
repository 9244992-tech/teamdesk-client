allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Плагины Flutter, написанные до AGP 8, задают имя пакета только в своём
// AndroidManifest.xml. AGP 8 это больше не принимает и требует namespace,
// иначе сборка падает с "Namespace not specified". Подставляем namespace
// из манифеста тем подпроектам, где он не задан.
subprojects {
    afterEvaluate { project ->
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null && androidExt.namespace == null) {
            def manifestFile = project.file("src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def pkg = new groovy.xml.XmlSlurper().parse(manifestFile).@package.text()
                if (pkg) {
                    androidExt.namespace = pkg
                    project.logger.lifecycle("namespace ${pkg} подставлен для ${project.name}")
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
